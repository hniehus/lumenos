name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/lumenos-build

jobs:
  toolchain-verify:
    name: Verify Toolchain Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate toolchain.json
        run: |
          python3 -m json.tool toolchain.json > /dev/null
          echo "✓ toolchain.json is valid JSON"

      - name: Check Dockerfile exists and is valid
        run: |
          docker build --no-cache -f Dockerfile --target lumenos-build --dry-run . 2>&1 | head -20
          echo "✓ Dockerfile structure is valid"

  build-image:
    name: Build Docker Image (Pinned Toolchain)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (for this run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: lumenos-build:ci-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show toolchain versions in image
        run: |
          docker build -f Dockerfile -t lumenos-build:temp .
          docker run --rm lumenos-build:temp bash -c \
            "echo '=== Build Environment ==='; \
             clang-18 --version; \
             ld.lld-18 --version; \
             nasm -version; \
             echo ''; make --version | head -3; \
             echo ''; qemu-system-x86_64 --version"

  build:
    name: Build LumenOS Kernel
    runs-on: ubuntu-latest
    needs: [toolchain-verify]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image with pinned toolchain
        run: |
          docker build -f Dockerfile -t lumenos-build:latest .

      - name: Build kernel (debug)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            lumenos-build:latest \
            bash -c "echo 'TODO: Add actual build steps'; echo 'make build' && make --version"

      - name: Run basic sanity checks
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            lumenos-build:latest \
            bash -c "echo 'TODO: Add kernel sanity checks'"

  test:
    name: Run Tests in QEMU
    runs-on: ubuntu-latest
    needs: [build]
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f Dockerfile -t lumenos-build:test .

      - name: Run tests (placeholder)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            lumenos-build:test \
            bash -c "echo 'TODO: Add QEMU test suite'"

  coverage:
    name: Report Build Information
    runs-on: ubuntu-latest
    needs: [toolchain-verify, build]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image and report versions
        run: |
          docker build -f Dockerfile -t lumenos-build:report .
          echo "## Build Environment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Toolchain Configuration**: \`toolchain.json\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          docker run --rm lumenos-build:report bash -c \
            "echo '- LLVM/Clang: '$(clang-18 --version | head -1); \
             echo '- Linker: '$(ld.lld-18 --version | head -1); \
             echo '- Assembler: '$(nasm -version | head -1)" | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
